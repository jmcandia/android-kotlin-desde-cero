site_name: Android con Kotlin desde cero
site_description: >-
  Un curso que lleva a programadores con base en Java desde los fundamentos de
  Kotlin hasta una aplicación Android completa con Jetpack Compose.
site_url: https://jmcandia.github.io/android-kotlin-desde-cero/

repo_url: https://github.com/jmcandia/android-kotlin-desde-cero
repo_name: GitHub

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/css/custom.css

plugins:
  - search:
      lang: es
  - callouts

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Inicio: index.md
  - "Parte I · Fundamentos de Kotlin":
      - "1. El entorno de desarrollo (IDE e IntelliJ IDEA)": chapter01.md
      - "2. Un primer vistazo a Kotlin": chapter02.md
      - "3. Conceptos básicos de Kotlin": chapter03.md
      - "4. Tipos de datos básicos": chapter04.md
      - "5. Operadores: aritméticos, de comparación y lógicos": chapter05.md
      - "6. Entrada y salida estándar y plantillas de cadena": chapter06.md
      - "7. Trabajar con cadenas: longitud, concatenación y <code>repeat</code>": chapter07.md
  - "Parte II · Estructuras de control y funciones":
      - "8. Control de flujo: <code>if</code> y <code>when</code> como expresión": chapter08.md
      - "9. Bucles: <code>for</code>, <code>while</code> y <code>do-while</code>": chapter09.md
      - "10. Funciones: definición, parámetros y valores de retorno": chapter10.md
  - "Parte III · Colecciones y código robusto":
